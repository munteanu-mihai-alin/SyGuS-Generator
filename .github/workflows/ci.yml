name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build clang-format python3 \
            gh git curl zip libgmp-dev

      - name: Check formatting
        run: |
          chmod +x scripts/check_clang_format.sh
          ./scripts/check_clang_format.sh

      - name: Restore Linux dependency bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dependencies/linux
          if ! gh release download sygus-linux-deps \
            -p 'sygus-linux-deps-ubuntu-latest.tar.gz' \
            -D dependencies/linux; then
            echo "Missing sygus-linux-deps release asset."
            echo "Trigger a push with %BUILD_RELEASE to build it."
            exit 1
          fi
          tar -xzf dependencies/linux/sygus-linux-deps-ubuntu-latest.tar.gz -C .
          test -d dependencies/linux/install

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -D SYGUS_BUILD_TESTS=ON \
            -D SYGUS_BUILD_SOLVER=ON \
            -D SYGUS_REQUIRE_CVC5=ON \
            -D CMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/dependencies/linux/install"

      - name: Build
        run: |
          cmake --build build -j"$(nproc)"

      - name: Package binaries
        run: |
          mkdir -p artifacts/linux-bin
          cp build/sygus_parse artifacts/linux-bin/
          cp build/sygus_solve artifacts/linux-bin/
          cp build/sygus_ut artifacts/linux-bin/
          cp build/sygus_mt artifacts/linux-bin/
          tar -czf artifacts/sygus-generator-linux-bin.tar.gz -C artifacts/linux-bin .

      - name: Upload Linux binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: sygus-generator-linux-bin
          path: artifacts/sygus-generator-linux-bin.tar.gz

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure

      - name: Smoke parser CLI
        run: |
          ./build/sygus_parse tests/data/lia_max2.sl

      - name: Smoke solver CLI
        run: |
          ./build/sygus_solve --json tests/data/lia_max2.sl

      - name: Validate benchmark runner
        run: |
          python3 -m py_compile scripts/run_sygus_benchmarks.py
          python3 scripts/run_sygus_benchmarks.py tests/data \
            --timeout 10 \
            --max-benchmarks 3 \
            --output results/benchmark-runs/ci-self-check.json

      - name: Upload benchmark self-check artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-self-check
          path: results/benchmark-runs/ci-self-check.json

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build lcov python3 \
            gh git curl zip libgmp-dev

      - name: Restore Linux dependency bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dependencies/linux
          if ! gh release download sygus-linux-deps \
            -p 'sygus-linux-deps-ubuntu-latest.tar.gz' \
            -D dependencies/linux; then
            echo "Missing sygus-linux-deps release asset."
            echo "Trigger a push with %BUILD_RELEASE to build it."
            exit 1
          fi
          tar -xzf dependencies/linux/sygus-linux-deps-ubuntu-latest.tar.gz -C .
          test -d dependencies/linux/install

      - name: Run coverage
        env:
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/dependencies/linux/install
        run: |
          chmod +x scripts/run_coverage_ci.sh
          ./scripts/run_coverage_ci.sh

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build-coverage/coverage-html

      - name: Upload coverage LCOV
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: build-coverage/coverage.filtered.info

  linux-deps-release:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '%BUILD_RELEASE')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build python3 gh git curl zip libgmp-dev

      - name: Build Linux dependency bundle
        run: |
          chmod +x scripts/rebuild_linux_deps_ci.sh
          ./scripts/rebuild_linux_deps_ci.sh

      - name: Upload Linux dependency artifact
        uses: actions/upload-artifact@v4
        with:
          name: sygus-linux-deps-ubuntu-latest
          path: dependencies/linux/sygus-linux-deps-ubuntu-latest.tar.gz

      - name: Create or update Linux dependency release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view sygus-linux-deps >/dev/null 2>&1 || \
            gh release create sygus-linux-deps \
              --title "sygus-linux-deps" \
              --notes "Reusable Linux cvc5 dependency bundle for SyGuS-Generator CI."
          gh release upload sygus-linux-deps \
            dependencies/linux/sygus-linux-deps-ubuntu-latest.tar.gz \
            --clobber
